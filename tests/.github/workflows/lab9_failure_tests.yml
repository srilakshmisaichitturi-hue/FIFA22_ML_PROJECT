name: Lab 9 - Failure Recovery Testing

on: [workflow_dispatch, push]

jobs:
  chaos-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy openpyxl

      - name: Inject Synthetic Corruptions
        run: |
          python pipelines/run_lab9_failure_handling.py

      - name: Run Recovery Verification Tests
        run: |
          python -m pytest tests/test_failure_recovery.py -v