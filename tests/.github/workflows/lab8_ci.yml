name: Lab 8 - Pipeline Automation & CI

# When should GitHub run this? Whenever code is pushed to main or master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download your repository code into the cloud machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.10 on that machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Install all required libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest scikit-learn pandas numpy joblib openpyxl

      # Step 4: Run the exact test that passed on your laptop
      - name: Run Unit Tests
        run: |
          python -m pytest tests/test_pipeline.py -v