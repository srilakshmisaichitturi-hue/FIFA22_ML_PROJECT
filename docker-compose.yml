version: '3.8'

services:
  # Service 1: Production FastAPI Serving Service
  fifa-prediction-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fifa22_prediction_service
    ports:
      - "8000:8000"
    restart: always
    environment:
      - MODEL_PATH=models/final_fifa22_model.pkl
      - SCALER_PATH=models/scaler.pkl

  # Service 2: MLflow Centralized Tracking Server (Optional local viewer)
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: fifa22_mlflow_ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000